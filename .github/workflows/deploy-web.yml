name: Build and deploy Godot Web game

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install matching Godot export templates
        run: |
          mkdir -p /tmp/godot-templates
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_export_templates.tpz \
            -o /tmp/godot-templates/export_templates.tpz
          unzip -q /tmp/godot-templates/export_templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.1.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.6.1.stable/"

      - name: Import project assets
        run: godot --headless --editor --path game --quit

      - name: Export Web build
        run: |
          mkdir -p game/build/web
          godot --headless --path game --export-release "Web" game/build/web/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: game/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
